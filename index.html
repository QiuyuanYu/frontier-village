/* ---------- utils ---------- */
function rand(x,y){let n=Math.sin(x*127.1+y*311.7+4521)*43758.5453;return n-Math.floor(n)}
function tile(x,y){return tiles[y*W+x]}
function count(type){return buildings.filter(b=>b.type===type).length}
function costText(cost){return Object.entries(cost).map(([k,v])=>({gold:'🪙',wood:'🪵',stone:'🪨',food:'🥕'}[k]+' '+v)).join(' · ')}
function hasCost(cost){return Object.entries(cost).every(([k,v])=>R[k]>=v)}
function pay(cost){for(const[k,v]of Object.entries(cost))R[k]-=v}
function addRes(obj){for(const[k,v]of Object.entries(obj))R[k]=Math.max(0,Math.min(99999,R[k]+v))}
function freeWorkers(){return Math.max(0,pop-buildings.reduce((a,b)=>a+b.workers,0)-militia)}

/* ---------- map ---------- */
function initMap(){
  tiles=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    let kind='grass';
    if(x<2||x>21||y<2||y>17)kind='tree';
    if((x<4&&y<6)||(x>19&&y<5)||(x<4&&y>15))kind='rock';
    if((x===11||x===12)&&y>0&&y<H-1)kind='road';
    if(y===10&&(x<9||x>14))kind='road';
    if((x===8||x===15)&&y>=8&&y<=12)kind='road';
    if(x>8&&x<15&&y>7&&y<13)kind='plaza';
    if(rand(x,y)>.97&&kind==='grass')kind='flower';
    tiles.push({x,y,kind,b:null});
  }
}

    const x=8+Math.floor(Math.random()*8), y=8+Math.floor(Math.random()*5);
    const tl=tile(x,y);
    if(tl&&!tl.b&&(tl.kind==='grass'||tl.kind==='plaza'||tl.kind==='flower'))return{x,y};
  }
  return{x:11,y:10};
}
function addBuilding(type,x,y,free){
  const b={id:nextId++,type,x,y,level:1,stored:0,workers:types[type].workers};
  buildings.push(b);
  const tl=tile(x,y); if(tl)tl.b=b;
  if(!free)pay(types[type].cost);
  capacity=10+count('house')*5+count('well')*2;
  return b;
}

/* ---------- save / load ---------- */
function save(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({
      v:1,lang,day,season,R,pop,happiness,level,rep,militia,guard,orderDone,claimed,
      buildings:buildings.map(b=>({id:b.id,type:b.type,x:b.x,y:b.y,level:b.level,stored:b.stored,workers:b.workers})),
      people
    }));
  }catch(e){/* ignore */}
}
function load(){
  let raw;
  try{raw=localStorage.getItem(SAVE_KEY)}catch(e){return false}
  if(!raw)return false;
  let d;
  try{d=JSON.parse(raw)}catch(e){return false}
  if(!d||d.v!==1)return false;
  try{
    R=Object.assign({gold:0,wood:0,stone:0,food:0},d.R||{});
    pop=Math.max(1,d.pop|0);
    happiness=Math.max(0,Math.min(100,d.happiness|0));
    level=Math.max(1,d.level|0);
    rep=d.rep|0; militia=d.militia|0; guard=d.guard|0; orderDone=d.orderDone|0;
    day=d.day||1; season=d.season|0; claimed=d.claimed||{};
    if(d.lang==='zh'||d.lang==='en')lang=d.lang;
    initMap();
    buildings=[];
    let maxId=0;
    (d.buildings||[]).forEach(sb=>{
      if(!types[sb.type])return;
      const tl=tile(sb.x,sb.y);
      if(!tl||tl.b)return;
      const nb={id:sb.id,type:sb.type,x:sb.x,y:sb.y,level:sb.level||1,stored:sb.stored||0,workers:sb.workers||0};
      tl.b=nb; buildings.push(nb);
      if(nb.id>maxId)maxId=nb.id;
    });
    nextId=maxId+1;
    capacity=10+count('house')*5+count('well')*2;
    if(Array.isArray(d.people)&&d.people.length===pop)people=d.people.map(p=>({x:p.x|0,y:p.y|0}));
    else people=Array.from({length:pop},()=>randomWalkSpot());
    selected=null;
    return true;
  }catch(e){return false}
}

/* ---------- new game ---------- */
function newGame(){
  R={gold:1250,wood:340,stone:120,food:85};
  pop=5; capacity=10; happiness=75; level=1; rep=0; militia=0; guard=0; orderDone=0;
  nextId=1; day=1; season=0; tick=0; buildings=[]; people=[]; claimed={}; selected=null;
  zoom=1; camX=0; camY=0; won=false; paused=false;
  initMap();
  addBuilding('house',9,8,true);
  addBuilding('farm',7,7,true);
  addBuilding('lumber',14,7,true);
  addBuilding('well',15,12,true);
  addBuilding('house',9,12,true);
  people=Array.from({length:5},(_,i)=>({x:9+i%3,y:9+Math.floor(i/3)}));
  selected={type:'building',id:buildings[1].id};
  save();
}

/* ---------- canvas ---------- */
function setupCanvas(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.round(BASE_W*dpr);
  canvas.height=Math.round(BASE_H*dpr);
  draw();
}
function drawBuilding(b,x,y){
  const c=ctx;
  c.fillStyle='#3e3227';c.fillRect(x+3,y+7,24,21);
  if(b.type==='farm'){
    c.fillStyle='#87633c';c.fillRect(x+3,y+5,24,23);
    c.fillStyle='#d2a956';for(let i=0;i<4;i++)c.fillRect(x+5+i*5,y+8,3,17);
    c.fillStyle='#79a650';for(let i=0;i<4;i++)c.fillRect(x+5+i*5,y+8,2,3);
  }else if(b.type==='well'){
    c.fillStyle='#8c9996';c.fillRect(x+4,y+10,22,17);
    c.fillStyle='#37423d';c.fillRect(x+8,y+14,14,10);
    c.fillStyle='#b7bcb3';c.fillRect(x+3,y+8,24,5);
  }else if(b.type==='wall'){
    c.fillStyle='#946d46';for(let i=0;i<5;i++)c.fillRect(x+3+i*5,y+7,4,22);
  }else{
    c.fillStyle=({lumber:'#a16d42',house:'#925a39',tavern:'#9a6744',barracks:'#77766b',quarry:'#888c85',market:'#a27a4d'})[b.type]||'#9a7652';
    c.fillRect(x+4,y+11,22,17);
    c.fillStyle='#d5b78b';c.beginPath();c.moveTo(x+1,y+12);c.lineTo(x+15,y+1);c.lineTo(x+29,y+12);c.closePath();c.fill();
    c.fillStyle='#78462e';c.beginPath();c.moveTo(x+1,y+12);c.lineTo(x+15,y+1);c.lineTo(x+15,y+7);c.lineTo(x+4,y+15);c.closePath();c.fill();
    c.fillStyle='#523c2c';c.fillRect(x+12,y+17,7,11);
    c.fillStyle='#dfc69c';c.fillRect(x+6,y+16,4,5);c.fillRect(x+21,y+16,4,5);
  }
  c.fillStyle='#fff1c9';c.font='bold 11px sans-serif';c.textAlign='center';c.fillText(b.level,x+15,y+28);
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,BASE_W,BASE_H);
  ctx.save();
  ctx.translate(BASE_W/2,BASE_H/2);
  ctx.scale(zoom,zoom);
  ctx.translate(-BASE_W/2+camX,-BASE_H/2+camY);

  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const a=tile(x,y),px=x*cell,py=y*cell;
    ctx.fillStyle=({road:'#ae8958',plaza:'#c5a16c',rock:'#66716b',tree:'#5e8244',flower:'#84a958',grass:rand(x,y)>.5?'#86b45a':'#709c4b'})[a.kind];
    ctx.fillRect(px,py,cell,cell);
    if(a.kind==='grass'&&rand(x+1,y+1)>.7){ctx.fillStyle='#6d9648';ctx.fillRect(px+8,py+12,2,2)}
    if(a.kind==='road'||a.kind==='plaza'){ctx.fillStyle='#d6b989';ctx.fillRect(px+5,py+8,3,2);ctx.fillRect(px+20,py+23,4,2)}
    if(a.kind==='tree'){
      ctx.fillStyle='#4d6337';ctx.fillRect(px+12,py+17,7,12);
      ctx.fillStyle='#315c35';ctx.beginPath();ctx.arc(px+15,py+12,13,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#4e7a40';ctx.beginPath();ctx.arc(px+10,py+9,8,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#6b9450';ctx.fillRect(px+7,py+6,4,3);
    }
    if(a.kind==='rock'){
      ctx.fillStyle='#9da29a';ctx.beginPath();ctx.moveTo(px+2,py+25);ctx.lineTo(px+9,py+6);ctx.lineTo(px+19,py+2);ctx.lineTo(px+28,py+22);ctx.closePath();ctx.fill();
      ctx.fillStyle='#c7c9c0';ctx.beginPath();ctx.moveTo(px+9,py+6);ctx.lineTo(px+19,py+2);ctx.lineTo(px+15,py+14);ctx.closePath();ctx.fill();
    }
    if(a.kind==='flower'){ctx.fillStyle='#eddf8b';ctx.fillRect(px+13,py+13,4,4)}
    if(a.b)drawBuilding(a.b,px,py);
  }

  people.forEach((p,i)=>{
    const x=p.x*cell+15,y=p.y*cell+17;
    ctx.fillStyle='#392b20';ctx.fillRect(x-5,y+4,10,8);
    ctx.fillStyle=['#d5a06b','#e6c6a0','#b47a4d','#f0d2ad'][i%4];ctx.fillRect(x-5,y-6,10,11);
    ctx.fillStyle='#503326';ctx.fillRect(x-6,y-8,12,4);
    ctx.fillStyle='#fff0c8';ctx.fillRect(x-3,y-3,2,2);ctx.fillRect(x+2,y-3,2,2);
  });

  if(selected){
    const a=selected.type==='building'?buildings.find(b=>b.id===selected.id):tile(selected.x,selected.y);
    if(a){ctx.strokeStyle='#ffec62';ctx.lineWidth=3;ctx.strokeRect(a.x*cell+2,a.y*cell+2,cell-4,cell-4)}
  }
  ctx.restore();
}

/* ---------- rendering ---------- */
function applyLang(){
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i)});
  $('questTitle').textContent=t('quest');
  $('villageTitle').textContent=t('overview');
  $('selectedTitle').textContent=t('selected');
  $('tipTitle').textContent=t('tiptitle');
  $('mapTip').textContent=t('maptip');
  $('footer').textContent=t('save');
}
function renderResources(){
  ['gold','wood','stone','food'].forEach(k=>{$ (k).textContent=Math.floor(R[k])});
  $('pop').textContent=pop+'/'+capacity;
  $('date').textContent=(lang==='zh'?'第'+day+'天 · ':'Day '+day+' · ')+T[lang].season[season];
  $('weather').textContent=T[lang].weather[(day+season)%4];
  $('happiness').textContent='☺ '+t('happiness')+' '+happiness+'%';
  $('pause').textContent=paused?t('paused'):t('running');
}
function qprog(q){
  if(q.type==='build')return count(q.target);
  if(q.type==='pop')return pop;
  if(q.type==='militia')return militia;
  if(q.type==='gold')return R.gold;
  if(q.type==='trade')return orderDone;
  if(q.type==='level')return level;
  return 0;
}
function renderQuest(){
  const list=qs.filter(q=>!claimed[q.id]).slice(0,4);
  $('questList').innerHTML=list.map(q=>{
    const p=Math.min(qprog(q),q.goal);
    return `<div class="task"><span style="flex:1"><b>${t('q'+q.id)}</b><br><span style="color:#cbb18d">${p}/${q.goal}</span><div class="bar"><i style="width:${p/q.goal*100}%"></i></div></span>${p>=q.goal?`<button data-claim="${q.id}">${t('claim')}</button>`:''}</div>`;
  }).join('')||`<p>${t('victory')}</p>`;
  $('questList').querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>claim(+b.dataset.claim));
}
function renderSelected(){
  const el=$('selected');
  if(!selected){el.innerHTML=`<p>${t('empty')}</p>`;return}
  if(selected.type==='building'){
    const b=buildings.find(b=>b.id===selected.id);
    if(!b){el.innerHTML=`<p>${t('empty')}</p>`;return}
    const typ=types[b.type];
    const prod=Object.entries(typ.out).map(([k,v])=>`${v*b.level} ${t(k+'Label')}`).join(', ')||'—';
    el.innerHTML=`<p style="font-size:16px"><b>${typ.icon} ${t(b.type)}</b></p><p>${t('buildingLevel')}: ${b.level}/3<br>${t('workersReq')}: ${b.workers}<br>${t('production')}: ${prod}</p><button id="upgrade">${t('upgrade')} · ${costText({gold:100*b.level,wood:50*b.level})}</button> <button id="collect">${t('collect')}</button> <button id="demolish">${t('demolish')}</button>`;
    $('upgrade').onclick=()=>upgrade(b);
    $('collect').onclick=()=>collect(b);
    $('demolish').onclick=()=>demolish(b);
  }else{
    const a=tile(selected.x,selected.y);
    const buildable=a&&a.kind==='grass';
    el.innerHTML=`<p><b>${t('emptyland')}</b> (${selected.x+1},${selected.y+1})</p><p>${buildable?t('buildable'):t('occupiedTile')}</p>`+(buildable?`<button id="buildHere">${t('buildhere')}</button>`:'');
    const bh=$('buildHere');
    if(bh)bh.onclick=()=>{tab='build';renderActions()};
  }
}
function renderOverview(){
  $('overview').innerHTML=`${t('population')}: <b>${pop}/${capacity}</b><br>${t('free')}: <b>${freeWorkers()}</b><br>${t('buildings')}: <b>${buildings.length}</b><br>${t('level')}: <b>${level}/5</b>`;
  $('income').textContent=`${t('foodNeed')}: ${Math.max(2,Math.ceil(pop*.6))} 🥕`;
  $('progress').innerHTML=`<small>${t('happiness')}: ${happiness}%</small><div class="bar green"><i style="width:${happiness}%"></i></div><small>${t('level')} ${level}/5</small><div class="bar blue"><i style="width:${Math.min(100,rep*10+buildings.length*5)}%"></i></div>`;
}
function render(){
  renderResources();renderQuest();renderOverview();renderSelected();renderActions();
}
function renderActions(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  const a=$('actions');
  if(tab==='build'){
    a.innerHTML=Object.keys(types).map(type=>{
      const x=types[type];
      return `<div class="action"><b>${x.icon} ${t(type)}</b><p>${t(type+'Desc')}<br>${t('cost')}: ${costText(x.cost)}</p><button data-build="${type}">${t('buildhere')}</button></div>`;
    }).join('');
    a.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>build(b.dataset.build));
  }else if(tab==='people'){
    a.innerHTML=`<div class="action"><b>🧑 ${t('hire')}</b><p>${t('hireDesc')}<br>🪙100 · 🥕10</p><button id="hire">${t('hire')}</button></div><div class="action"><b>👨‍🌾 ${t('workers')}</b><p>${t('free')}: ${freeWorkers()}</p><button id="assign">${t('autoAssign')}</button></div><div class="action"><b>☺ ${t('happiness')}</b><p>${happiness}%</p><button id="festival">${t('festivalBtn')}</button></div>`;
    $('hire').onclick=hire;
    $('assign').onclick=()=>{autoAssign();save();toast(t('autoAssign'));render();draw()};
    $('festival').onclick=festival;
  }else if(tab==='trade'){
    const deals=[['wood',30,90,'sell'],['food',25,75,'sell'],['stone',20,100,'sell'],['wood',30,120,'buy'],['food',30,90,'buy'],['stone',20,130,'buy']];
    a.innerHTML=`<div class="action" style="grid-column:1/-1"><b>⚖️ ${t('tradeTitle')}</b><p>${t('tradeDesc')}<br>${lang==='zh'?'已完成交易':'Trades completed'}: ${orderDone}</p></div>`+
      deals.map((d,i)=>`<div class="action"><b>${d[3]==='sell'?'📦':'🛒'} ${t(d[3])} ${t(d[0]+'Label')}</b><p>${d[3]==='sell'?'-':'+'}${d[1]} · ${d[3]==='sell'?'+':'−'}${d[2]} 🪙</p><button data-trade="${i}">${t(d[3])}</button></div>`).join('');
    a.querySelectorAll('[data-trade]').forEach(b=>b.onclick=()=>trade(deals[+b.dataset.trade]));
  }else if(tab==='military'){
    a.innerHTML=`<div class="action"><b>🛡️ ${t('train')}</b><p>${t('trainDesc')}<br>🪙120 · 🥕15</p><button id="train">${t('train')}</button></div><div class="action"><b>🏰 ${t('hireGuard')}</b><p>${t('guardDesc')}<br>🪙180</p><button id="guard">${t('hireGuard')}</button></div><div class="action"><b>⚔️ ${t('defense')}</b><p>Militia: ${militia} · Guards: ${guard}</p><button id="drill">${t('drill')}</button></div>`;
    $('train').onclick=train;
    $('guard').onclick=hireGuard;
    $('drill').onclick=drill;
  }else{
    a.innerHTML=qs.map(q=>{
      const done=qprog(q)>=q.goal;
      return `<div class="action"><b>${t('q'+q.id)} ${claimed[q.id]?'✓':''}</b><p>${t('qdesc'+q.id)}<br>${t('progress')}: ${Math.min(q.goal,qprog(q))}/${q.goal}<br>${t('reward')}: ${costText(q.reward)}</p>${done&&!claimed[q.id]?`<button data-qclaim="${q.id}">${t('claim')}</button>`:''}</div>`;
    }).join('');
    a.querySelectorAll('[data-qclaim]').forEach(b=>b.onclick=()=>claim(+b.dataset.qclaim));
  }
}

/* ---------- actions ---------- */
function build(type){
  const cost=types[type].cost;
  if(!hasCost(cost)){toast(t('notEnough'));return}
  const target=selected&&selected.type==='tile'?tile(selected.x,selected.y):null;
  if(!target||target.kind!=='grass'||target.b){toast(t('noSpace'));return}
  pay(cost);
  const b=addBuilding(type,target.x,target.y,true);
  selected={type:'building',id:b.id};
  autoAssign();
  save();
  toast(t('built'));
  render();draw();
}
function upgrade(b){
  if(b.level>=3){toast(t('upgradeMax'));return}
  const cost={gold:100*b.level,wood:50*b.level};
  if(!hasCost(cost)){toast(t('notEnough'));return}
  pay(cost);b.level++;
  save();
  toast(t('upgraded'));
  render();draw();
}
function collect(b){
  const keys=Object.keys(types[b.type].out);
  if(!keys.length||!b.stored){toast(t('nothing'));return}
  addRes({[keys[0]]:b.stored});
  b.stored=0;
  save();
  render();draw();
}
function demolish(b){
  if(!confirm(t('demolishConfirm')))return;
  buildings=buildings.filter(x=>x.id!==b.id);
  const tl=tile(b.x,b.y);if(tl)tl.b=null;
  selected=null;
  capacity=10+count('house')*5+count('well')*2;
  save();
  toast(t('demolished'));
  render();draw();
}
function autoAssign(){
  let slots=Math.max(0,pop-militia);
  buildings.forEach(b=>b.workers=0);
  buildings.forEach(b=>{
    const need=types[b.type].workers;
    if(need<=0)return;
    const n=Math.min(need,slots);
    b.workers=n;slots-=n;
  });
}
function hire(){
  if(pop>=capacity){toast(t('noRoom'));return}
  if(R.gold<100){toast(t('noGold'));return}
  if(R.food<10){toast(t('noFood'));return}
  R.gold-=100;R.food-=10;pop++;
  people.push(randomWalkSpot());
  autoAssign();save();
  toast(t('hireSuccess'));
  render();draw();
}
function train(){
  if(!count('barracks')){toast(t('buildFirst'));return}
  if(R.gold<120){toast(t('noGold'));return}
  if(R.food<15){toast(t('noFood'));return}
  if(freeWorkers()<1){toast(t('noVillagers'));return}
  R.gold-=120;R.food-=15;militia++;
  save();
  toast(t('trainSuccess'));
  render();
}
function hireGuard(){
  if(R.gold<180){toast(t('noGold'));return}
  R.gold-=180;guard++;
  save();
  render();
}
function drill(){
  if(R.food<10){toast(t('noFood'));return}
  R.food-=10;happiness=Math.min(100,happiness+3);
  save();
  toast(t('drillDone'));
  render();
}
function festival(){
  if(R.gold<80){toast(t('noGold'));return}
  R.gold-=80;happiness=Math.min(100,happiness+15);
  save();
  render();
}
function trade(d){
  const[k,qty,price,type]=d;
  if(type==='sell'){
    if(R[k]<qty){toast(t('tradeFail'));return}
    R[k]-=qty;R.gold=Math.min(99999,R.gold+price);
  }else{
    if(R.gold<price){toast(t('noGold'));return}
    R.gold-=price;R[k]=Math.min(99999,R[k]+qty);
  }
  orderDone++;
  save();
  toast(t('tradeDone'));
  render();
}
function claim(id){
  const q=qs.find(x=>x.id===id);
  if(!q||claimed[id]||qprog(q)<q.goal)return;
  claimed[id]=true;addRes(q.reward);rep++;
  save();
  toast(t('questReward'));
  render();
}

/* ---------- daily tick ---------- */
function newDay(){
  day++;tick++;
  if(day%15===0)season=(season+1)%4;

  for(const b of buildings){
    const def=types[b.type];
    if(!def)continue;
    const needWorker=def.workers>0;
    const eff=needWorker?(b.workers>0?1:.25):1;
    for(const[k,v]of Object.entries(def.out)){
      let amount=Math.floor(v*b.level*eff);
      if(k==='food'&&season===3)amount=Math.floor(amount*.5);
      if(amount<=0)continue;
      if(k==='gold')R.gold=Math.min(99999,R.gold+amount);
      else b.stored=Math.min(9999,b.stored+amount);
    }
  }

  const need=Math.max(2,Math.ceil(pop*.6));
  R.food-=need;
  if(R.food<0){R.food=0;happiness=Math.max(10,happiness-8)}
  else happiness=Math.min(100,happiness+1);

  R.gold=Math.min(99999,R.gold+Math.floor(pop*2+happiness/10));

  if(day%7===0){
    if(Math.random()<.55){
      if(militia+guard>=2){R.gold=Math.min(99999,R.gold+40);rep++;toast(t('raidWin'))}
      else{
        R.gold=Math.max(0,R.gold-80);R.food=Math.max(0,R.food-20);
        happiness=Math.max(10,happiness-10);toast(t('raidLoss'));
      }
    }else{
      happiness=Math.min(100,happiness+5);R.food=Math.min(99999,R.food+15);toast(t('festival'));
    }
  }
  if(day%10===0&&Math.random()<.25)toast(t('drought'));

  levelCheck();
  save();
  render();draw();
}
function levelCheck(){
  let n=1;
  if(buildings.length>=7&&pop>=7)n=2;
  if(buildings.length>=10&&pop>=10&&militia>=2)n=3;
  if(buildings.length>=14&&pop>=13&&rep>=5)n=4;
  if(buildings.length>=18&&pop>=16&&rep>=8&&militia>=4)n=5;
  if(n>level){
    level=n;
    toast(t('levelUp'));
    if(level>=5&&!won){
      won=true;paused=true;save();renderResources();
      setTimeout(()=>showModal('🏆 '+t('victory'),t('victoryText'),t('cont'),()=>{paused=false;renderResources()}),350);
    }
  }
}

/* ---------- modal ---------- */
function showModal(title,text,btn,cb){
  $('modalTitle').textContent=title;
  $('modalText').textContent=text;
  $('modalClose').textContent=btn||'OK';
  $('modalClose').onclick=()=>{$('modal').classList.remove('show');if(cb)cb()};
  $('modal').classList.add('show');
}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('show')});

/* ---------- input ---------- */
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  const sx=(e.clientX-r.left)/r.width*BASE_W;
  const sy=(e.clientY-r.top)/r.height*BASE_H;
  const wx=(sx-BASE_W/2)/zoom-camX+BASE_W/2;
  const wy=(sy-BASE_H/2)/zoom-camY+BASE_H/2;
  const mx=Math.floor(wx/cell),my=Math.floor(wy/cell);
  if(mx<0||mx>=W||my<0||my>=H)return;
  const a=tile(mx,my);
  selected=a.b?{type:'building',id:a.b.id}:{type:'tile',x:mx,y:my};
  renderSelected();draw();
});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderActions()});
$('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';applyLang();render();save()};
$('pause').onclick=()=>{paused=!paused;renderResources();toast(paused?t('pausedMsg'):t('resumed'))};
$('restart').onclick=()=>{
  if(!confirm(t('restartConfirm')))return;
  try{localStorage.removeItem(SAVE_KEY)}catch(e){}
  newGame();
  applyLang();
  render();draw();
  toast(t('welcome'));
};
$('zoomin').onclick=()=>{zoom=Math.min(1.6,zoom+.1);draw()};
$('zoomout').onclick=()=>{zoom=Math.max(.7,zoom-.1);draw()};
$('center').onclick=()=>{zoom=1;camX=camY=0;draw()};
window.addEventListener('resize',()=>{clearTimeout(window.__rt);window.__rt=setTimeout(setupCanvas,150)});
window.addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

/* ---------- boot ---------- */
function init(){
  const loaded=load();
  if(!loaded)newGame();
  applyLang();
  setupCanvas();
  render();
  toast(loaded?t('saveLoaded'):t('welcome'));
}
setInterval(()=>{if(!paused){tick++;if(tick%8===0)newDay()}},1000);
init();
})();
</script>
</body>
</html>
